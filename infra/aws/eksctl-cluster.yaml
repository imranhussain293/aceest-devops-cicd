apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: aceest-eks
  region: ap-south-1
  version: "1.33"

availabilityZones:
  - ap-south-1a
  - ap-south-1b

managedNodeGroups:
  - name: aceest-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    privateNetworking: false
    labels:
      workload: aceest-fitness
